name: CI/CD Pipeline - Deploy to VietNix

on:
  push:
    branches: [ "main" ] # Tự động chạy khi push code vào nhánh main
  workflow_dispatch:      # Cho phép bấm nút chạy thủ công nếu cần

jobs:
  build-and-push-docker:
    name: Build Docker Image and Push to Docker Hub
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Đăng nhập vào Docker Hub để có quyền đẩy (push) ảnh lên
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker Image dựa trên file Dockerfile ở thư mục gốc
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/3dprintshop-be:latest

  deploy-to-vps:
    name: SSH into VietNix and Update Container
    needs: build-and-push-docker # Chỉ chạy khi bước Build ở trên thành công
    runs-on: ubuntu-latest
    
    steps:
      - name: executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Login vào Docker Hub trên Server (nếu cần cho Private Repo)
            # echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 2. Dừng và xóa container cũ + Xóa luôn Image cũ để giải phóng cache
            docker stop 3dprint-api || true
            docker rm 3dprint-api || true

            # Xóa image cũ để đảm bảo lệnh pull tiếp theo lấy bản 'fresh' nhất
            docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/3dprintshop-be:latest || true

            # 3. Tải bản Image mới nhất về
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/3dprintshop-be:latest

            # 4. Chạy container mới
            # -p 80:8080 nghĩa là truy cập web qua cổng 80 (HTTP bình thường) của VPS
            docker run -d \
              --name 3dprint-api \
              --restart always \
              -p 8080:8080 \
              -e ASPNETCORE_ENVIRONMENT="Production" \
              -e AllowedHosts="*" \
              -e ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION_STRING }}" \
              -e Cors__AllowedOrigins__0="http://localhost:3000" \
              -e Cors__AllowedOrigins__1="https://capstone-backup-fe.vercel.app" \
              -e Cors__AllowedOrigins__2="https://3dprintshop.store" \
              -e JwtSettings__Secret="${{ secrets.JWT_SECRET }}" \
              -e JwtSettings__Issuer="3DPrintShop_Backend" \
              -e JwtSettings__Audience="3DPrintShop_Clients" \
              -e PayOS__ClientId="${{ secrets.PAYOS_CLIENT_ID }}" \
              -e PayOS__ApiKey="${{ secrets.PAYOS_API_KEY }}" \
              -e PayOS__ChecksumKey="${{ secrets.PAYOS_CHECKSUM }}" \
              -e PayOS__ReturnUrl="https://capstone-backup-fe.vercel.app/order-confirmation" \
              -e PayOS__CancelUrl="https://capstone-backup-fe.vercel.app/order-confirmation" \
              -e EmailSettings__SmtpServer="${{ secrets.EMAILSETTINGS__SMTPSERVER }}" \
              -e EmailSettings__Port="${{ secrets.EMAILSETTINGS__PORT }}" \
              -e EmailSettings__FromEmail="${{ secrets.EMAILSETTINGS__FROMEMAIL }}" \
              -e EmailSettings__AppPassword="${{ secrets.EMAILSETTINGS__APPPASSWORD }}" \
              -e EmailSettings__DisplayName="3D Print Shop Support" \
              -e DevAccount__Username="admin_dev" \
              -e DevAccount__Password="${{ secrets.DEV_ADMIN_PASSWORD }}" \
              -e DevAccount__Fullname="Dev Administrator" \
              -e AI__GenerateUrl="https://nestable-lucille-nonruinously.ngrok-free.dev/generate" \
              -e OpenRouter__ApiKey="${{ secrets.OPENROUTER_API_KEY }}" \
              -e BackblazeB2__KeyId="${{ secrets.BACKBLAZEB2_KEYID }}" \
              -e BackblazeB2__ApplicationKey="${{ secrets.BACKBLAZEB2_APPLICATIONKEY }}" \
              -e BackblazeB2__BucketName="${{ secrets.BACKBLAZEB2_BUCKETNAME }}" \
              -e BackblazeB2__ServiceUrl="${{ secrets.BACKBLAZEB2_SERVICEURL }}" \
              -e VNPay__TmnCode="${{ secrets.VNPAY_TMN_CODE }}" \
              -e VNPay__HashSecret="${{ secrets.VNPAY_HASH_SECRET }}" \
              -e VNPay__PaymentUrl="https://sandbox.vnpayment.vn/paymentv2/vpcpay.html" \
              -e VNPay__ReturnUrl="https://api.3dprintshop.store/api/transaction/vnpay-return" \
              -e VNPay__IpnUrl="https://api.3dprintshop.store/api/transaction/vnpay-ipn" \
              -e VNPay__ApiBaseUrl="https://api.3dprintshop.store" \
              -e VNPay__FrontendReturnUrl="https://capstone-backup-fe.vercel.app" \
              -e GHN__Token="${{ secrets.GHN_TOKEN }}" \
              -e GHN__ShopId="${{ secrets.GHN_SHOP_ID }}" \
              -e GHN__FromDistrictId="${{ secrets.GHN_FROM_DISTRICT_ID }}" \
              -e GHN__FromWardCode="${{ secrets.GHN_FROM_WARD_CODE }}" \
              -e GHN__FromProvinceId="${{ secrets.GHN_FROM_PROVINCE_ID }}" \
              -e GHN__FromPhone="${{ secrets.GHN_FROM_PHONE }}" \
              -e GHN__FromAddress="Lô E2a-7, Đường D1, Khu CNC TP.HCM, Phường Tăng Nhơn Phú A, TP. Thủ Đức, Hồ Chí Minh" \
              -e GHN__FromName="3D Print Shop" \
              -e GHN__DefaultWeightGrams="500" \
              -e GHN__ServiceTypeId="2" \
              -e GHN__FallbackFee="30000" \
              ${{ secrets.DOCKERHUB_USERNAME }}/3dprintshop-be:latest

            # 5. Dọn dẹp các Image cũ không dùng đến để tiết kiệm dung lượng VPS
            docker image prune -f
