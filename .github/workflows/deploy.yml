name: CI/CD Pipeline - Deploy to VietNix

on:
  push:
    branches: [ "main" ] # Tự động chạy khi push code vào nhánh main
  workflow_dispatch:      # Cho phép bấm nút chạy thủ công nếu cần

jobs:
  build-and-push-docker:
    name: Build Docker Image and Push to Docker Hub
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Đăng nhập vào Docker Hub để có quyền đẩy (push) ảnh lên
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker Image dựa trên file Dockerfile ở thư mục gốc
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/3dprintshop-be:latest

  deploy-to-vps:
    name: SSH into VietNix and Update Container
    needs: build-and-push-docker # Chỉ chạy khi bước Build ở trên thành công
    runs-on: ubuntu-latest
    
    steps:
      - name: executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Login vào Docker Hub trên Server (nếu cần cho Private Repo)
            # echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 2. Tải bản Image mới nhất về
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/3dprintshop-be:latest

            # 3. Dừng và xóa container cũ để tránh xung đột Port
            docker stop 3dprint-api || true
            docker rm 3dprint-api || true

            # 4. Chạy container mới
            # -p 80:8080 nghĩa là truy cập web qua cổng 80 (HTTP bình thường) của VPS
            docker run -d \
              --name 3dprint-api \
              --restart always \
              -p 80:8080 \
              -e ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION_STRING }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/3dprintshop-be:latest

            # 5. Dọn dẹp các Image cũ không dùng đến để tiết kiệm dung lượng VPS
            docker image prune -f
